name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PoloLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar enlace directo (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PoloLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PoloLauncher.apk --title "Polo Launcher (última versión)" --notes "APK listo para instalar en la pantalla."
