plugins {
    id 'com.android.application'
}

android {
    namespace 'es.jorge.pololauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'es.jorge.pololauncher'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
