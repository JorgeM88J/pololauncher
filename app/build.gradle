plugins {
    id 'com.android.application'
}

android {
    namespace 'es.jorge.pololauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'es.jorge.pololauncher'
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    // Firma fija: así cada APK nuevo se instala encima del anterior sin perder los datos.
    signingConfigs {
        polo {
            storeFile file('polo.keystore')
            storePassword 'pololauncher'
            keyAlias 'polo'
            keyPassword 'pololauncher'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.polo
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
